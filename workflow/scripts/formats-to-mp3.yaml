name: formats-to-mp3
url: https://transcribe.com/zh/formats-to-mp3
title: 免費將檔案轉為 MP3
subtitle: Transcribe 線上轉檔
locale: zh-TW
aspectRatio: "16:9"
voiceover: true
brandColor: "#2f6fed"
viewport:
  width: 1280
  height: 720
captions:
  - atStep: 0
    text: 免費線上轉檔，支援影音格式
  - atStep: 6
    text: 上傳聲音或影片檔案
  - atStep: 8
    text: 可選：裁切音訊區間
  - atStep: 12
    text: 一鍵轉成 MP3
  - atStep: 16
    text: 常見格式問題一次看懂
steps:
  - action: goto
    waitUntil: networkidle
  - action: wait
    ms: 1400
  - action: scroll
    selector: "text=準備您的聲音檔"
  - action: wait
    ms: 900
  - action: scroll
    y: 280
  - action: wait
    ms: 900
  - action: upload
    selector: 'input[type="file"]'
    path: ../fixtures/sample-tone.wav
  - action: wait
    ms: 1600
  - action: click
    selector: "text=選填: 定義部分轉換的音訊區間"
  - action: wait
    ms: 1100
  - action: scroll
    y: 220
  - action: wait
    ms: 700
  - action: click
    selector: "text=轉檔"
  - action: wait
    ms: 2400
  - action: scroll
    y: 650
  - action: wait
    ms: 700
  - action: click
    selector: "text=我可以把哪些檔案格式轉為 mp3？"
  - action: wait
    ms: 1800
  - action: scroll
    y: 200
  - action: wait
    ms: 1200
