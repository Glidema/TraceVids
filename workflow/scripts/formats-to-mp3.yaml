name: formats-to-mp3
url: https://transcribe.com/zh/formats-to-mp3
title: 免費將檔案轉為 MP3
subtitle: Transcribe 線上轉檔
locale: zh-TW
viewport:
  width: 1280
  height: 720
steps:
  - action: goto
    waitUntil: networkidle
  - action: wait
    ms: 1400
  - action: scroll
    selector: "text=準備您的聲音檔"
  - action: wait
    ms: 900
  - action: scroll
    y: 280
  - action: wait
    ms: 900
  - action: upload
    selector: 'input[type="file"]'
    path: ../fixtures/sample-tone.wav
  - action: wait
    ms: 1600
  - action: click
    selector: "text=選填: 定義部分轉換的音訊區間"
  - action: wait
    ms: 1100
  - action: scroll
    y: 220
  - action: wait
    ms: 700
  - action: click
    selector: "text=轉檔"
  - action: wait
    ms: 2400
  - action: scroll
    y: 650
  - action: wait
    ms: 700
  - action: click
    selector: "text=我可以把哪些檔案格式轉為 mp3？"
  - action: wait
    ms: 1800
  - action: scroll
    y: 200
  - action: wait
    ms: 1200
